general {
    # hyprlock directly (not caelestia's screencopy lock) -> no CScreenshareFrame crash on resume
    before_sleep_cmd = pidof hyprlock || hyprlock --grace 10
    after_sleep_cmd = $HOME/.local/bin/hypr-on-resume
}

listener {
    timeout = 300
    on-timeout = pidof hyprlock || hyprlock --grace 10
}

# Turn screen off at 8 min idle
listener {
    timeout = 480
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
