# Colors — synced from caelestia scheme by scheme-sync-hyprlock. Keep these 7 lines.
$base = rgba(18120eff)
$surface = rgba(241e1acc)
$text = rgba(ece0d9ff)
$subtext = rgba(d6c3b5ff)
$primary = rgba(ffb878ff)
$outline = rgba(9f8e81ff)
$error = rgba(ffb4abff)

general {
    disable_loading_bar = true
    hide_cursor = true
    no_fade_in = false
}

background {
    monitor =
    # static image (NOT `screenshot`) -> no screencopy -> no CScreenshareFrame crash on resume
    path = /home/fab/.local/state/caelestia/wallpaper/current
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.89
    brightness = 0.82
    vibrancy = 0.17
}

image {
    monitor =
    path = /home/fab/.face
    size = 110
    rounding = -1
    border_size = 2
    border_color = $primary
    position = 0, 230
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = $text
    font_size = 88
    font_family = CaskaydiaCove Nerd Font Mono
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = $subtext
    font_size = 18
    font_family = CaskaydiaCove Nerd Font Mono
    position = 0, 0
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 55
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.25
    dots_center = true
    outer_color = $outline
    inner_color = $surface
    font_color = $text
    fade_on_empty = false
    placeholder_text = <i>Password</i>
    check_color = $primary
    fail_color = $error
    rounding = 16
    font_family = CaskaydiaCove Nerd Font Mono
    position = 0, -110
    halign = center
    valign = center
}
